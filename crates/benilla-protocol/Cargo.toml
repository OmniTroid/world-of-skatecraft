[package]
name = "benilla-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WoW 1.12.1 auth (SRP6) + world wire protocol and the benilla-auth CLI"

[lints]
workspace = true

[dependencies]
web-time.workspace = true
anyhow.workspace = true
clap.workspace = true
benilla-srp = { path = "../benilla-srp" }
flate2 = "1.0"
sha1.workspace = true
# Derives `SessionEventKind`, `SessionEvent`'s fieldless twin that the handler table keys on.
strum = { version = "0.26", features = ["derive"] }

# The web build's sockets (`net/web.rs`): a WebSocket to the page's bridge.
[target.'cfg(target_arch = "wasm32")'.dependencies]
crossbeam-channel = "0.5"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "BinaryType", "MessageEvent", "Window", "Location", "console"] }

[dev-dependencies]
# The SRP probe example re-derives the handshake by hand, to vary what `benilla-srp` fixes.
num-bigint = "0.4.6"
rand = "0.8.6"
