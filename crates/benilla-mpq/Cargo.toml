[package]
name = "benilla-mpq"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only MPQ archive reader for WoW 1.12.1 (build 5875)"

[lints]
workspace = true

[dependencies]
# Bounds-checked byte readers and the allocation cap on the header, block table and sectors.
benilla-bytes = { path = "../benilla-bytes" }
# Inflate for the ZLIB (0x02) sector codec, on its pure-Rust miniz_oxide backend.
flate2 = "1.1"

# The web build's file layer (`fs/web.rs`): synchronous Range requests on the page's origin.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
