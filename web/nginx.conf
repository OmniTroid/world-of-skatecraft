server {
    listen 80;
    # Cross-origin isolation, for SharedArrayBuffer.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control no-cache always;

    types {
        text/html html;
        text/javascript js mjs;
        application/wasm wasm;
        application/json json;
    }

    location / {
        root /srv/web;
    }

    # The install, read-only: Range reads and a JSON listing per directory.
    location /wow/ {
        alias /srv/wow/;
        autoindex on;
        autoindex_format json;
    }

    # The skate engine's converted assets and sounds.
    location /skate/ {
        alias /srv/skate/;
    }
    location /skate-audio/ {
        alias /srv/skate-audio/;
    }

    location ~ ^/tcp/(3724|8085)$ {
        # Docker's DNS, for the per-port `bridge:$1` target.
        resolver 127.0.0.11 valid=30s;
        proxy_pass http://bridge:$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 1d;
    }
}
